# Local Postgres for BookNBuy. No Supabase, no hosted DB.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booknbuy
      POSTGRES_PASSWORD: booknbuy
      POSTGRES_DB: booknbuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
