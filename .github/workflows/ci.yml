name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Build-time only; no live secrets needed (pages fall back to demo data)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          BETTER_AUTH_SECRET: ci-only-secret-min-32-chars-long
